<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" fill="none">
  <defs>
    <linearGradient id="waveGradA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="waveGradB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="waveGradC" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="waveGradD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Flow Stream 1 -->
  <path d="M 0,80 C 130,25 260,140 400,80 C 540,25 670,140 800,80" stroke="url(#waveGradA)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Flow Stream 2 -->
  <path d="M 0,180 C 130,240 260,120 400,180 C 540,240 670,120 800,180" stroke="url(#waveGradB)" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Flow Stream 3 -->
  <path d="M 0,280 C 130,220 260,340 400,280 C 540,220 670,340 800,280" stroke="url(#waveGradC)" stroke-width="2.0" stroke-linecap="round"/>

  <!-- Flow Stream 4 -->
  <path d="M 0,380 C 130,440 260,320 400,380 C 540,440 670,320 800,380" stroke="url(#waveGradD)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Flow Stream 5 -->
  <path d="M 0,480 C 130,420 260,540 400,480 C 540,420 670,540 800,480" stroke="url(#waveGradA)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Flow Stream 6 -->
  <path d="M 0,580 C 130,640 260,520 400,580 C 540,640 670,520 800,580" stroke="url(#waveGradB)" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Flow Stream 7 -->
  <path d="M 0,680 C 130,620 260,740 400,680 C 540,620 670,740 800,680" stroke="url(#waveGradC)" stroke-width="2.0" stroke-linecap="round"/>

  <!-- Flow Stream 8 -->
  <path d="M 0,760 C 130,710 260,790 400,760 C 540,710 670,790 800,760" stroke="url(#waveGradD)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
